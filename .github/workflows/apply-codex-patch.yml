name: Apply Codex legal patch

on:
  push:
    branches: [main]
    paths:
      - .github/codex/opspilot.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          base64 --decode .github/codex/opspilot.patch.gz.b64 | gunzip > /tmp/opspilot.patch
          git apply --index /tmp/opspilot.patch
          git rm .github/codex/opspilot.patch.gz.b64 .github/workflows/apply-codex-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Supabase seed and public GDPR pages"
          git push origin HEAD:main
