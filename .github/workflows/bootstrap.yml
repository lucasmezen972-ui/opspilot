name: Bootstrap OpsPilot (1-click setup)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hpqfmuzkkxrqoqoabjmb

    steps:
      - uses: actions/checkout@v4

      # 1. Supabase CLI
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 2. Migrations SQL (via Management API - aucun mot de passe DB requis)
      - name: Apply SQL migrations
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant."
            exit 1
          fi
          echo "=== Application des migrations SQL ==="
          for f in supabase/migrations/2026*.sql; do
            [ -f "$f" ] || continue
            echo "-> $(basename "$f")"
            payload=$(jq -Rs '{query: .}' < "$f")
            out=$(curl -sS -w '\n%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            code=${out##*$'\n'}
            resp=${out%$'\n'*}
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK"
            elif echo "$resp" | grep -qiE 'already exists|duplicate'; then
              echo "Deja appliquee (ignoree)"
            else
              echo "Erreur ($code): ${resp:0:500}" >&2
              exit 1
            fi
          done
          echo "=== Migrations terminees ==="

      # 3. Secrets Edge Functions
      - name: Set Edge Function secrets
        run: |
          echo "=== Configuration des secrets Edge Functions ==="
          supabase secrets set \
            --project-ref "$PROJECT_REF" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            APP_URL="https://lucasmezen972-ui.github.io/opspilot"
          echo "Secrets Edge Functions configures"

      # 4. Deploiement Edge Functions
      - name: Deploy Edge Functions
        run: |
          echo "=== Deploiement des Edge Functions ==="
          for dir in supabase/functions/*/; do
            func=$(basename "$dir")
            echo "-> Deploiement : $func"
            supabase functions deploy "$func" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt
            echo "$func deploye"
          done
          echo "=== Deploiement termine ==="

      # 5. Resume
      - name: Summary
        run: |
          echo "======================================"
          echo "Bootstrap OpsPilot termine !"
          echo "======================================"
          echo "- Migrations SQL appliquees"
          echo "- Secrets Edge Functions configures"
          echo "- Edge Functions deployees"
          echo ""
          echo "App : https://lucasmezen972-ui.github.io/opspilot"
          echo "Supabase : https://supabase.com/dashboard/project/$PROJECT_REF"
