name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::Secret SUPABASE_DB_URL manquant. Ajoutez-le dans Settings > Secrets > Actions."
            exit 1
          fi

      # Applique uniquement les migrations V2 (2026*) non encore exécutées,
      # suivies dans une table dédiée. Les migrations historiques (2025*)
      # ont déjà été appliquées via le dashboard.
      - name: Apply pending migrations
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS _applied_migrations(name text PRIMARY KEY, applied_at timestamptz DEFAULT now());"
          for f in supabase/migrations/2026*.sql; do
            name=$(basename "$f")
            applied=$(psql "$DB_URL" -tA -c "SELECT 1 FROM _applied_migrations WHERE name='$name'")
            if [ "$applied" = "1" ]; then
              echo "✓ $name déjà appliquée"
            else
              echo "→ Application de $name"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
                "INSERT INTO _applied_migrations(name) VALUES ('$name');"
              echo "✓ $name appliquée"
            fi
          done
