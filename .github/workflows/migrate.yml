name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hpqfmuzkkxrqoqoabjmb

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check secret
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::notice::Secret SUPABASE_ACCESS_TOKEN absent - skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find changed migrations
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=$(ls supabase/migrations/2026*.sql 2>/dev/null | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'supabase/migrations/2026*.sql' | tr '\n' ' ')
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending migrations
        if: steps.check.outputs.skip == 'false' && steps.changed.outputs.files != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Application des migrations SQL ==="
          for f in ${{ steps.changed.outputs.files }}; do
            [ -f "$f" ] || continue
            case "$f" in
              *20260609230000_v2_onboarding.sql | *20260609250000_v2_audit_templates.sql)
                echo "-> $(basename "$f") : perimee (ignoree)"; continue ;;
            esac
            echo "-> $(basename "$f")"
            payload=$(jq -Rs '{query: .}' < "$f")
            out=$(curl -sS -w '\n%{http_code}' --max-time 30 -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            code=${out##*$'\n'}
            resp=${out%$'\n'*}
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK"
            elif echo "$resp" | grep -qiE 'already exists|duplicate'; then
              echo "Deja appliquee (ignoree)"
            else
              echo "Erreur ($code): ${resp:0:500}" >&2
              exit 1
            fi
          done
          echo "=== Migrations terminees ==="
