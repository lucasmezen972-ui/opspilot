name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hpqfmuzkkxrqoqoabjmb

    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::notice::Secret SUPABASE_ACCESS_TOKEN absent - skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending migrations
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Application des migrations SQL ==="
          for f in supabase/migrations/2026*.sql; do
            [ -f "$f" ] || continue
            # Périmée : remplacée par 20260610120000_sync_onboarding_rpcs_live.sql
            # (le type de retour des RPC a changé sur le projet live → 42P13 si rejouée)
            case "$f" in
              *20260609230000_v2_onboarding.sql | *20260609250000_v2_audit_templates.sql)
                echo "-> $(basename "$f") : perimee (ignoree)"; continue ;;
            esac
            echo "-> $(basename "$f")"
            payload=$(jq -Rs '{query: .}' < "$f")
            out=$(curl -sS -w '\n%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            code=${out##*$'\n'}
            resp=${out%$'\n'*}
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK"
            elif echo "$resp" | grep -qiE 'already exists|duplicate'; then
              echo "Deja appliquee (ignoree)"
            else
              echo "Erreur ($code): ${resp:0:500}" >&2
              exit 1
            fi
          done
          echo "=== Migrations terminees ==="
