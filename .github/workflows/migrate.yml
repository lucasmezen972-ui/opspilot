name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hpqfmuzkkxrqoqoabjmb

    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::notice::Secret SUPABASE_ACCESS_TOKEN absent — skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending migrations
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Application des migrations SQL ==="
          for f in supabase/migrations/2026*.sql; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "→ $name"
            python3 - "$f" <<'PYEOF'
import sys, json, urllib.request, os

sql_file = sys.argv[1]
token = os.environ["SUPABASE_ACCESS_TOKEN"]
ref = os.environ["PROJECT_REF"]
sql = open(sql_file).read()

data = json.dumps({"query": sql}).encode()
req = urllib.request.Request(
    f"https://api.supabase.com/v1/projects/{ref}/database/query",
    data=data,
    headers={
        "Authorization": f"Bearer {token}",
        "Content-Type": "application/json",
    },
)
try:
    resp = urllib.request.urlopen(req)
    print(f"✅ OK: {resp.read().decode()[:200]}")
except urllib.error.HTTPError as e:
    body = e.read().decode()
    if "already exists" in body or "duplicate" in body.lower():
        print(f"⏭  Already applied (skipped): {body[:200]}")
    else:
        print(f"❌ Error: {body[:500]}", file=sys.stderr)
        sys.exit(1)
PYEOF
          done
          echo "=== Migrations terminées ==="
